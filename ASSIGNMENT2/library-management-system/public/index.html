<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Library Management System</h1>
        
        <!-- Form for POST and PUT operations -->
        <div class="form-card">
            <h2 id="form-title">Add a New Book</h2>
            <form id="book-form">
                <input type="hidden" id="book-id">
                <div class="input-group">
                    <label for="title">Book Title:</label>
                    <input type="text" id="title" required placeholder="Enter book title">
                </div>
                <div class="input-group">
                    <label for="author">Author Name:</label>
                    <input type="text" id="author" required placeholder="Enter author name">
                </div>
                <div class="button-group">
                    <button type="submit" id="submit-btn" class="btn primary">Add Book</button>
                    <button type="button" id="cancel-btn" class="btn secondary hidden">Cancel Edit</button>
                </div>
            </form>
        </div>

        <!-- Container for GET operations -->
        <h2>Book Records</h2>
        <div id="books-container" class="books-grid">
            <!-- Books will be injected here via JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
